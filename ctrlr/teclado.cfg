<?xml version="1.0"?>
<!--
  Controles por defecto del proyecto para `make mame` / `make mame-mvs`.
  Motivo: el default de MAME usa Ctrl para el botón A, y en macOS
  Ctrl + flechas son atajos del sistema (Mission Control, Espacios).
  Cambiar a gusto desde el menú de MAME (Tab); eso se guarda en cfg/ y tiene prioridad.
-->
<mameconfig version="10">
    <system name="default">
        <input>
            <port type="P1_BUTTON1"><newseq type="standard">KEYCODE_Z OR JOYCODE_1_BUTTON1</newseq></port>
            <port type="P1_BUTTON2"><newseq type="standard">KEYCODE_X OR JOYCODE_1_BUTTON2</newseq></port>
            <port type="P1_BUTTON3"><newseq type="standard">KEYCODE_C OR JOYCODE_1_BUTTON3</newseq></port>
            <port type="P1_BUTTON4"><newseq type="standard">KEYCODE_V OR JOYCODE_1_BUTTON4</newseq></port>
            <port type="P1_START"><newseq type="standard">KEYCODE_1 OR KEYCODE_ENTER OR JOYCODE_1_START</newseq></port>
            <port type="START1"><newseq type="standard">KEYCODE_1 OR KEYCODE_ENTER OR JOYCODE_1_START</newseq></port>
        </input>
    </system>
</mameconfig>
